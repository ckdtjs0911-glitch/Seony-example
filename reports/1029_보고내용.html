<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10월 29일 보고 내용</title>
<style>
  :root {
    --navy: #2b3a67;
    --blue: #1f5fbf;
    --line: #d5dae3;
    --muted: #5b6475;
    --text: #1d1f24;
    --bg: #ffffff;
    --callout: #eef3fb;
    --red: #d0312d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f2f4f7;
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    font-size: 13px;
    line-height: 1.6;
  }
  .page {
    background: var(--bg);
    max-width: 210mm;
    margin: 24px auto;
    padding: 18mm 16mm;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  h1 {
    font-size: 24px;
    margin: 0 0 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  h2 { color: var(--blue); font-size: 17px; margin: 28px 0 12px; }
  h3 { font-size: 14.5px; margin: 20px 0 10px; }
  p { margin: 0 0 10px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 0 0 14px;
    font-size: 12.5px;
  }
  th {
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    padding: 7px 8px;
    border: 1px solid var(--navy);
  }
  td {
    padding: 7px 8px;
    border: 1px solid var(--line);
    vertical-align: top;
  }
  td.c { text-align: center; }
  td.group { background: #f6f7fa; font-weight: 600; text-align: center; vertical-align: middle; }
  .em { color: var(--red); font-weight: 700; }
  figure { margin: 6px 0 18px; text-align: center; }
  figure img { max-width: 100%; border: 1px solid var(--line); }
  figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .callout {
    background: var(--callout);
    border-left: 4px solid var(--blue);
    padding: 10px 14px;
    margin: 4px 0 14px;
    font-weight: 600;
  }
  ol { margin: 0 0 10px; padding-left: 22px; }
  .table-wrap { overflow-x: auto; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 26px 0 0; }
  @media (max-width: 640px) {
    .page { margin: 0; padding: 20px 16px; box-shadow: none; }
  }
  @media print {
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; max-width: none; padding: 0; }
    h2 { break-after: avoid; }
    h2.new-page { break-before: page; margin-top: 0; }
    hr { display: none; }
    table, figure { break-inside: avoid; }
    th, td.group, .callout { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @page { size: A4; margin: 16mm; }
</style>
</head>
<body>
<main class="page">
  <h1>10월 29일 보고 내용</h1>

  <h2>1. M2 – 얼리 부스트 – 사전검토 상황</h2>

  <figure>
    <img src="images/m2-early-boost-status.png" alt="민원 처리 현황 화면">
    <figcaption>[그림 1] M2 얼리 부스트 사전검토 민원 처리 현황 화면</figcaption>
  </figure>

  <hr>

  <h2 class="new-page">2. ISO 13485 심사 관련</h2>

  <h3>2-1. 심사 주기</h3>
  <p>ISO 13485 인증의 유효기간은 3년이며, 유지하려면 매년 사후심사를 받고 3년마다 갱신심사를 받아야 함.</p>
  <figure>
    <img src="images/iso13485-audit-cycle.png" alt="ISO 13485 심사 주기">
    <figcaption>[그림 2] ISO 13485 심사 주기 및 일정 (출처: PPT 화면 내 표기 – NSF.org, www.ntreecert.kr 외)</figcaption>
  </figure>

  <div class="callout">현재 상황: 사후심사 준비 중</div>

  <h3>2-2. 사후심사 준비 내용</h3>
  <ol>
    <li>품질절차서 내용 수정</li>
    <li>품질절차서 관련 양식 확보 및 작성</li>
  </ol>
</main>
</body>
</html>
